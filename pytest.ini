[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    # Raised inside joblib while loading the model file, not in our code.
    ignore:Setting the shape on a NumPy array:DeprecationWarning:joblib
    # The saved model must be loaded by the scikit-learn version that trained it
    # (pinned in backend/requirements.txt) - fail loudly if they ever drift.
    error::sklearn.exceptions.InconsistentVersionWarning
